<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panda Telecom — 產品目錄</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;background:#f5f5f5;color:#1a1a1a}
.top{background:#111;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:500}
.top.open{background:#15803d}
.top.closed{background:#92400e}
nav{background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:0;z-index:100}
nav .inner{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;height:52px;gap:12px}
.logo{font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none;color:#111}
.logo .mark{display:inline-block;width:28px;height:28px;background:#111;color:#fff;border-radius:6px;text-align:center;line-height:28px;font-size:9px;margin-right:6px}
.search{flex:1;padding:8px 14px;border-radius:8px;border:1.5px solid #e0e0e0;font-size:14px;outline:none;min-width:0;background:#f8f8f8}
.search:focus{border-color:#22c55e;background:#fff}
.bar{padding:10px 16px;font-size:13px;color:#888;max-width:1200px;margin:0 auto;display:flex;gap:12px}
.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 14px;border-radius:16px;border:1.5px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap;font-weight:500}
.tab:hover{border-color:#bbb}
.tab.on{background:#22c55e;color:#fff;border-color:#22c55e}
.cats{display:flex;gap:5px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:4px 10px;border-radius:12px;border:1px solid #e0e0e0;background:#fff;font-size:11px;color:#888;cursor:pointer;white-space:nowrap}
.cat.on{background:#111;color:#fff;border-color:#111}
.main{max-width:1200px;margin:8px auto;padding:0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e8e8e8;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
.card-thumb{height:180px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card-thumb img{max-width:90%;max-height:90%;object-fit:contain}
.card-thumb .brand-tag{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);color:#fff;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.card-body{padding:10px 12px;flex:1;display:flex;flex-direction:column}
.card-name{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-price{font-size:17px;color:#22c55e;font-weight:700;margin-top:auto}
.card-srp{font-size:11px;color:#bbb;text-decoration:line-through;margin-left:4px}
.card-wa{display:block;text-align:center;background:#25D366;color:#fff;padding:6px;font-size:12px;text-decoration:none;margin-top:6px;border-radius:0 0 12px 12px;font-weight:600}
.card-wa:hover{background:#1fa855}
.empty{text-align:center;padding:60px 20px;color:#888}
.foot{text-align:center;padding:20px;color:#aaa;font-size:11px}
</style>
</head>
<body>
<div class="top" id="topBar">🕐 檢查中…</div>
<nav><div class="inner">
  <a class="logo" href="/"><span class="mark">PT</span>Panda Telecom</a>
  <input class="search" id="search" placeholder="搜尋產品…" autocomplete="off"/>
</div></nav>
<div class="bar">共 <b id="total">0</b> 件｜顯示 <b id="shown">0</b> 件</div>
<div class="tabs" id="tabs"></div>
<div class="cats" id="cats"></div>
<div class="main" id="list"></div>
<div class="foot">WhatsApp 查詢：<a href="https://wa.me/85268557181" style="color:#25D366">6855 7181</a></div>

<script src="products-all.js"></script>
<script>
(function(){
var P = window.ALL_PRODUCTS || [];
var brands = {};
P.forEach(function(p){
  var b = p.brand;
  if(!brands[b]) brands[b] = [];
  brands[b].push(p);
});
var brandList = Object.keys(brands).sort();
var curBrand = '', curCat = '';

function render() {
  var q = (document.getElementById('search').value||'').toLowerCase().trim();
  var src = curBrand ? brands[curBrand] : P;
  if(curCat) src = src.filter(function(p){return p.category===curCat;});
  if(q) src = src.filter(function(p){
    return (p.name||'').toLowerCase().indexOf(q)!==-1 ||
           (p.brand||'').toLowerCase().indexOf(q)!==-1 ||
           (p.id||'').toLowerCase().indexOf(q)!==-1;
  });
  document.getElementById('shown').textContent = src.length;
  var el = document.getElementById('list');
  if(!src.length){ el.innerHTML='<div class="empty">😕 冇搵到相關產品</div>'; return; }
  var h = '<div class="grid">';
  src.forEach(function(p){
    var img = p.image || '';
    var imgTag = img ? '<img src="'+img+'" alt="'+p.name+'" loading="lazy" onerror="this.style.display=\'none\'"/>'+(!img.match(/http|\.(png|jpe?g|webp)$/i)?'<img src="'+img+'" style="max-width:100%;max-height:100%" />':'') : '';
    if(!img && img.match(/\.svg$/i)) imgTag = '<img src="'+img+'" style="max-width:100%;max-height:100%" />';
    h += '<div class="card" onclick="(function(){var x=P.find(function(a){return a.id===\''+(p.id||'').replace(/'/g,'\\\'')+'\';});if(!x)return;alert(x.brand+\' \'+x.name+\'\\n\\nPrice: $\'+(x.msrp||x.srp)+\'\\n\\nWhatsApp: 6855 7181\');})()">';
    h += '<div class="card-thumb">';
    if(p.brand) h += '<span class="brand-tag">'+p.brand+'</span>';
    h += imgTag;
    h += '</div>';
    h += '<div class="card-body">';
    h += '<div class="card-name">'+p.name+'</div>';
    h += '<div class="card-price">$'+(p.msrp||p.srp)+(p.srp&&p.msrp&&p.msrp<p.srp?'<span class="card-srp">$'+p.srp+'</span>':'')+'</div>';
    h += '<a class="card-wa" href="https://wa.me/85268557181?text='+encodeURIComponent('我想查詢 '+p.brand+' '+p.name)+'" target="_blank" onclick="event.stopPropagation()">💬 WhatsApp 查詢</a>';
    h += '</div></div>';
  });
  h += '</div>';
  el.innerHTML = h;
}

// Tabs
var tabsEl = document.getElementById('tabs');
var allTab = document.createElement('span');
allTab.className = 'tab on';
allTab.textContent = '全部 ('+P.length+')';
allTab.onclick = function(){curBrand='';curCat='';render();updateTabs();};
tabsEl.appendChild(allTab);
brandList.forEach(function(b){
  var t = document.createElement('span');
  t.className = 'tab';
  t.textContent = b + ' (' + brands[b].length + ')';
  t.onclick = function(){curBrand=b;curCat='';render();updateTabs();renderCats();};
  tabsEl.appendChild(t);
});

function updateTabs() {
  var all = tabsEl.querySelectorAll('.tab');
  all.forEach(function(t){t.classList.remove('on');});
  if(!curBrand) all[0].classList.add('on');
  else {
    for(var i=1;i<all.length;i++){
      if(all[i].textContent.indexOf(curBrand+' (')===0){all[i].classList.add('on');break;}
    }
  }
}

// Category pills
function renderCats() {
  var catsEl = document.getElementById('cats');
  catsEl.innerHTML = '';
  var src = curBrand ? brands[curBrand] : P;
  var cats = {}; src.forEach(function(p){cats[p.category]=1;});
  var catList = Object.keys(cats).sort();
  
  var allC = document.createElement('span');
  allC.className = 'cat' + (curCat?'':' on');
  allC.textContent = '全部分類';
  allC.onclick = function(){curCat='';render();renderCats();};
  catsEl.appendChild(allC);
  
  catList.forEach(function(c){
    var chip = document.createElement('span');
    chip.className = 'cat' + (curCat===c?' on':'');
    chip.textContent = c;
    chip.onclick = function(){curCat = curCat===c ? '' : c;render();renderCats();};
    catsEl.appendChild(chip);
  });
}

// Search
document.getElementById('search').addEventListener('input', function(){
  clearTimeout(this._t); this._t = setTimeout(render, 200);
});

// Status
(function(){
  var n = new Date(), d = n.getDay(), h = n.getHours(), m = n.getMinutes();
  var open = d>=1 && d<=6 && h*60+m>=720 && h*60+m<1200;
  var bar = document.getElementById('topBar');
  bar.textContent = open ? '🟢 營業中 — WhatsApp：6855 7181' : '🔴 休息中 — 週一至六 12:00-20:00';
  bar.className = 'top ' + (open?'open':'closed');
})();

// Init
document.getElementById('total').textContent = P.length;
renderCats();
render();
})();
</script>
</body>
</html>
